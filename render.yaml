services:
  # Backend FastAPI Service
  - type: web
    name: payguard-x-backend
    runtime: python
    buildCommand: pip install -r payguard-x/backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir payguard-x/backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # Frontend Vite/React Static Site
  - type: web
    name: payguard-x-frontend
    runtime: static
    buildCommand: cd payguard-x/frontend && npm install && npm run build
    staticPublishPath: ./payguard-x/frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: payguard-x-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
